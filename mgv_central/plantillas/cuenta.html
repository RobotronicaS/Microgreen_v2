{% extends "base.html" %}
{% block contenido %}
<section class="panel estrecho">
  <h1>Mi cuenta</h1><p>{{ usuario.nombre }}</p>
  {% if cambiada %}<p class="estado aldia" role="status">Contraseña actualizada</p>{% endif %}
  <form method="post" class="form-col">
    <input type="hidden" name="csrf" value="{{ usuario.csrf }}">
    <label>Contraseña actual <input type="password" name="anterior" autocomplete="current-password" maxlength="128" required></label>
    <label>Nueva contraseña <input type="password" name="nueva" autocomplete="new-password" minlength="12" maxlength="128" required></label>
    <button class="boton primario">Cambiar contraseña</button>
  </form>
</section>
{% endblock %}
