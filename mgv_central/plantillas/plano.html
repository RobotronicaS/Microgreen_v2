<svg class="floor-map" viewBox="0 0 920 {{ plano.alto }}" role="group" aria-label="Esquema de equipos de {{ sitio.nombre }}" data-mapa>
<defs><pattern id="ground" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#dbe3d4"/></pattern></defs><rect width="920" height="{{ plano.alto }}" fill="url(#ground)"/><text x="45" y="37" font-size="11" fill="#7b8b73">VISTA SUPERIOR</text><rect x="65" y="70" width="640" height="{{ plano.filas*105+61 }}" rx="65" fill="#f0f5e8" stroke="#afc3a1" stroke-width="3"/>
{% for r in range(plano.filas) %}<g><text x="97" y="{{ 119+r*105 }}" font-size="10" fill="#8d9d7f">SECTOR {{ r+1 }}</text><rect x="110" y="{{ 130+r*105 }}" width="548" height="64" rx="8" fill="#dce9cb" stroke="#c4d7b3"/>{% for i in range(18) %}<g transform="translate({{ 128+i*29 }} {{ 153+r*105 }})"><path d="M0 9V-4" stroke="#98af77"/><ellipse cx="-4" cy="-2" rx="6" ry="3" fill="#a1bd82" transform="rotate(35)"/><ellipse cx="5" cy="-4" rx="6" ry="3" fill="#b1c98f" transform="rotate(-35)"/><ellipse cx="-4" cy="17" rx="5" ry="3" fill="#a6bf85"/></g>{% endfor %}</g>{% endfor %}
{% for c in sitio.camaras if c.equipo %}<path class="vinculo" data-vinculo="{{ c.id }}" data-zero="{{ c.nodo_id }}" d="M{{ c.equipo.px }} {{ c.equipo.py }} V{{ c.py }} H{{ c.px }}" stroke="#79a184" stroke-width="1.2" stroke-dasharray="5 5" opacity=".3" fill="none"/>{% endfor %}
{% for c in sitio.camaras %}<g class="svg-button" data-device="camara" data-id="{{ c.id }}" data-zero="{{ c.nodo_id }}" role="button" tabindex="0" aria-label="Cámara {{ c.nombre }}" transform="translate({{ c.px }} {{ c.py }})"><title>{{ c.nombre }} · {{ c.etiqueta }}</title><rect class="device-ring" x="-43" y="-50" width="86" height="69" rx="14" fill="white" stroke="#c2d3b6" stroke-width="1.5"/><image href="/static/esquemas/camera.svg" x="-43" y="-53" width="86" height="68"/><circle cx="32" cy="-39" r="5" fill="{{ '#6a9862' if c.estado=='aldia' else '#cf9d52' if c.estado=='atrasada' else '#a7b2a0' }}" stroke="white" stroke-width="2"/><rect x="-100" y="24" width="200" height="25" rx="6" fill="#f9fbf6" fill-opacity=".95"/><text y="40" text-anchor="middle" fill="#52664b" font-size="11">{{ c.nombre|truncate(27, true) }}</text></g>{% endfor %}
{% for n in sitio.nodos %}<g class="svg-button" data-device="zero" data-id="{{ n.id }}" role="button" tabindex="0" aria-label="Raspberry Pi {{ n.nombre }}" transform="translate({{ n.px }} {{ n.py }})"><title>{{ n.nombre }} · {{ n.etiqueta }}</title><rect class="device-ring" x="-61" y="-53" width="122" height="91" rx="14" fill="white" stroke="#c2d3b6" stroke-width="1.5"/><image href="/static/esquemas/board.svg" x="-62" y="-49" width="124" height="85"/><circle cx="47" cy="-43" r="5" fill="{{ '#6a9862' if n.estado=='aldia' else '#cf9d52' }}" stroke="white" stroke-width="2"/><text y="59" text-anchor="middle" fill="#3e604b" font-size="12" font-weight="600">{{ n.nombre|truncate(25, true) }}</text><text y="76" text-anchor="middle" fill="#839079" font-size="10">Raspberry Pi Zero</text></g>{% endfor %}
</svg>
